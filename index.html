<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex Pro + Pokémon Battle Arena</title>
  <meta name="description" content="Pokédex interativa com Team Builder, batalhas 3x3, SMART AI e Campaign completa construída em JavaScript Vanilla.">

  <!-- ====================================================================
       RECURSOS EXTERNOS (FONTES E ÍCONES)
       ==================================================================== -->
  <!-- Google Fonts: Tipografia moderna (Outfit para títulos, Inter para leitura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FontAwesome: Biblioteca de ícones (corações, lupa, som, setas, etc.) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ====================================================================
       FOLHAS DE ESTILO (CSS MODULAR)
       ==================================================================== -->
  <link rel="stylesheet" href="assets/css/reset.css">   <!-- Variáveis de cores e reset padrão -->
  <link rel="stylesheet" href="assets/css/global.css">  <!-- Layout, cabeçalho e controles -->
  <link rel="stylesheet" href="assets/css/pokedex.css"> <!-- Grid e cards de Pokémon -->
  <link rel="stylesheet" href="assets/css/modal.css">   <!-- Janela modal de detalhes -->
  <link rel="stylesheet" href="assets/css/battle-animations.css"> <!-- Animações de Pokémon (PBA-009) -->
  <link rel="stylesheet" href="assets/css/move-vfx.css"> <!-- Efeitos Visuais de Golpes (PBA-010) -->
  <link rel="stylesheet" href="assets/css/battle-camera.css"> <!-- Câmera e Impacto de Batalha (PBA-012) -->
  <link rel="stylesheet" href="assets/css/battle-arena.css"> <!-- Arena e Interface de Batalha (PBA-013) -->
  <link rel="stylesheet" href="assets/css/type-arena.css"> <!-- Sistema de Arenas por Tipo (PBA-018A) -->
  <link rel="stylesheet" href="assets/css/trainer-profile.css"> <!-- Perfil do Treinador (PBA-014) -->
  <link rel="stylesheet" href="assets/css/campaign.css?v=2.3-mobile">
  <link rel="stylesheet" href="assets/css/campaign-map.css?v=2.3-mobile">
  <link rel="stylesheet" href="assets/css/campaign-wild.css">

  <!-- Favicon SVG (Ícone da aba do navegador) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23EE1515'/><path d='M2 50 A48 48 0 0 0 98 50 Z' fill='%23FFFFFF'/><path d='M2 50 L98 50' stroke='%23222224' stroke-width='8'/><circle cx='50' cy='50' r='16' fill='%23222224'/><circle cx='50' cy='50' r='10' fill='%23FFFFFF'/></svg>">
</head>
<body>

  <!-- CONTAINER PRINCIPAL DA APLICAÇÃO -->
  <div class="app-container">
    
    <!-- 1. CABEÇALHO (Logo, título e ações de favoritos/tema) -->
    <header class="header">
      <div class="header-top">
        <div class="logo-container">
          <svg class="pokeball-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="46" fill="#EE1515" stroke="#222224" stroke-width="6"/>
            <path d="M4 50 A46 46 0 0 0 96 50 Z" fill="#FFFFFF"/>
            <path d="M4 50 L96 50" stroke="#222224" stroke-width="6"/>
            <circle cx="50" cy="50" r="16" fill="#222224"/>
            <circle cx="50" cy="50" r="10" fill="#FFFFFF"/>
          </svg>
          <h1 class="app-title">Pokédex <span>DIO Pro</span></h1>
        </div>

        <div class="header-actions">
          <!-- Botão para alternar exibição de favoritos -->
          <button id="favoritesToggleBtn" class="icon-btn" title="Meus Favoritos" aria-label="Favoritos">
            <i class="fa-solid fa-heart"></i>
            <span id="favCounter" class="badge-counter" style="display: none;">0</span>
          </button>
          <!-- Botão para alternar tema Dark / Light -->
          <button id="themeToggleBtn" class="icon-btn" title="Alternar Tema" aria-label="Alternar Tema">
            <i class="fa-solid fa-sun"></i>
          </button>
        </div>
      </div>

      <!-- Navegação Principal entre Módulos -->
      <nav class="app-nav" aria-label="Navegação entre Módulos">
        <button id="navPokedexBtn" class="nav-tab active" data-tab="pokedex">
          <i class="fa-solid fa-book-open"></i>
          <span>Pokédex</span>
        </button>
        <button id="navTeamBtn" class="nav-tab" data-tab="team">
          <i class="fa-solid fa-users"></i>
          <span>Meu Time</span>
          <span id="teamNavCounter" class="nav-badge">0/3</span>
        </button>
        <button id="navBattleBtn" class="nav-tab" data-tab="battle">
          <i class="fa-solid fa-khanda"></i>
          <span>Batalhar</span>
        </button>
        <button id="navCampaignBtn" class="nav-tab" data-tab="campaign">
          <i class="fa-solid fa-trophy"></i><span>Campanha</span>
        </button>
        <button id="navProfileBtn" class="nav-tab" data-tab="profile">
          <i class="fa-solid fa-id-card"></i>
          <span>Perfil</span>
        </button>
      </nav>
    </header>

    <!-- MÓDULO 1: VISÃO DA POKÉDEX (Totalmente Preservada) -->
    <div id="pokedexView" class="view-panel">
      <!-- 2. PAINEL DE CONTROLES (Busca em tempo real, filtros e ordenação) -->
      <section class="controls-panel" aria-label="Filtros e Busca">
        
        <!-- Campo de Busca -->
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nome ou número (ex: Pikachu, 25)..." autocomplete="off">
          <button type="button" class="clear-search-btn" id="clearSearchBtn" aria-label="Limpar campo de busca" title="Limpar busca" style="display: none;">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div class="filters-row">
          <!-- Filtro por Geração -->
          <div class="custom-select-wrapper">
            <select id="generationSelect" class="custom-select" aria-label="Selecionar Geração">
              <option value="1">1ª Geração (Kanto: 1-151)</option>
              <option value="2">2ª Geração (Johto: 152-251)</option>
              <option value="3">3ª Geração (Hoenn: 252-386)</option>
              <option value="4">4ª Geração (Sinnoh: 387-493)</option>
              <option value="5">5ª Geração (Unova: 494-649)</option>
              <option value="6">6ª Geração (Kalos: 650-721)</option>
              <option value="7">7ª Geração (Alola: 722-809)</option>
              <option value="8">8ª Geração (Galar: 810-905)</option>
              <option value="9">9ª Geração (Paldea: 906-1025)</option>
              <option value="all">Todas as Gerações</option>
            </select>
            <i class="fa-solid fa-chevron-down select-arrow"></i>
          </div>

          <!-- Filtro de Ordenação -->
          <div class="custom-select-wrapper">
            <select id="sortSelect" class="custom-select" aria-label="Ordenar por">
              <option value="id-asc">Número (Menor ao Maior)</option>
              <option value="id-desc">Número (Maior ao Menor)</option>
              <option value="name-asc">Nome (A - Z)</option>
              <option value="name-desc">Nome (Z - A)</option>
              <option value="stat-desc">Mais Forte (Total Stats)</option>
            </select>
            <i class="fa-solid fa-arrow-down-short-wide select-arrow"></i>
          </div>
        </div>

        <!-- Filtro por Pílulas de Tipos -->
        <nav class="type-pills-container" aria-label="Filtrar por tipo">
          <button class="type-pill active" data-type="all">Todos</button>
          <button class="type-pill" data-type="grass" style="--pill-color: var(--type-grass);">🌱 Grass</button>
          <button class="type-pill" data-type="fire" style="--pill-color: var(--type-fire);">🔥 Fire</button>
          <button class="type-pill" data-type="water" style="--pill-color: var(--type-water);">💧 Water</button>
          <button class="type-pill" data-type="electric" style="--pill-color: var(--type-electric);">⚡ Electric</button>
          <button class="type-pill" data-type="bug" style="--pill-color: var(--type-bug);">🐛 Bug</button>
          <button class="type-pill" data-type="poison" style="--pill-color: var(--type-poison);">☠️ Poison</button>
          <button class="type-pill" data-type="flying" style="--pill-color: var(--type-flying);">🕊️ Flying</button>
          <button class="type-pill" data-type="normal" style="--pill-color: var(--type-normal);">⚪ Normal</button>
          <button class="type-pill" data-type="ground" style="--pill-color: var(--type-ground);">🏜️ Ground</button>
          <button class="type-pill" data-type="fairy" style="--pill-color: var(--type-fairy);">✨ Fairy</button>
          <button class="type-pill" data-type="fighting" style="--pill-color: var(--type-fighting);">🥊 Fighting</button>
          <button class="type-pill" data-type="psychic" style="--pill-color: var(--type-psychic);">🔮 Psychic</button>
          <button class="type-pill" data-type="rock" style="--pill-color: var(--type-rock);">🪨 Rock</button>
          <button class="type-pill" data-type="ghost" style="--pill-color: var(--type-ghost);">👻 Ghost</button>
          <button class="type-pill" data-type="ice" style="--pill-color: var(--type-ice);">❄️ Ice</button>
          <button class="type-pill" data-type="dragon" style="--pill-color: var(--type-dragon);">🐉 Dragon</button>
          <button class="type-pill" data-type="steel" style="--pill-color: var(--type-steel);">⚙️ Steel</button>
          <button class="type-pill" data-type="dark" style="--pill-color: var(--type-dark);">🌑 Dark</button>
        </nav>
      </section>

      <!-- 3. CONTEÚDO PRINCIPAL (Grid de Pokémon e Botão de Carregar Mais) -->
      <main>
        <div class="stats-summary">
          <span id="resultCount">Carregando Pokémon...</span>
        </div>

        <!-- Lista ordenada onde os cards dinâmicos serão inseridos pelo JS -->
        <ol id="pokemonList" class="pokemons-grid">
          <!-- Preenchido dinamicamente via assets/js/main.js -->
        </ol>

        <!-- Botão de Paginação -->
        <div class="pagination-container">
          <button id="loadMoreButton" type="button" class="load-more-btn">
            <span>Carregar Mais</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
      </main>
    </div>

    <!-- MÓDULO 2: GERENCIADOR DE EQUIPE (Team Builder - PBA-002) -->
    <section id="teamView" class="view-panel" style="display: none;" aria-label="Meu Time Pokémon">
      <!-- Preenchido dinamicamente via assets/js/team/team-ui.js -->
    </section>

    <!-- MÓDULO 3: ARENA DE BATALHA (Em Desenvolvimento - Battle Arena PBA-003+) -->
    <section id="futureModuleView" class="future-module-view" style="display: none;" aria-live="polite">
      <!-- Preenchido dinamicamente ao selecionar 'Batalhar' -->
    </section>

    <section id="campaignView" class="view-panel" style="display: none;" aria-label="Circuito dos Mestres"></section>

    <!-- MÓDULO 4: PERFIL DO TREINADOR (PBA-014) -->
    <section id="profileView" class="view-panel" style="display: none;" aria-label="Perfil do Treinador">
      <!-- Preenchido dinamicamente via assets/js/trainer/trainer-ui.js -->
    </section>

    <!-- 4. MODAL FLUTUANTE (Detalhes, Atributos de Batalha e Evolução) -->
    <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
      <div class="modal-container" id="pokemonModal" role="dialog" aria-modal="true" aria-labelledby="modalPokemonName">
        <div id="modalDynamicContent">
          <!-- Preenchido dinamicamente ao clicar em qualquer Pokémon -->
        </div>
      </div>
    </div>

    <!-- 5. RODAPÉ -->
    <footer class="footer">
      <p>Desenvolvido para o Desafio de Projeto da <strong>DIO (Digital Innovation One)</strong></p>
      <p>Dados fornecidos por <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer">PokéAPI</a></p>
    </footer>
  </div>

       SCRIPTS JAVASCRIPT (Ordem de importação é essencial)
